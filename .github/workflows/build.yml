name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & install platforms
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AdSkip.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/AdSkip.apk \
            --title "广告跳过助手 $TAG" \
            --notes "自动构建的 APK，下载后直接安装。安装后请到系统「无障碍」设置中开启本应用的服务。" \
            --latest || gh release upload "$TAG" dist/AdSkip.apk --clobber

      - name: Commit APK into repo for Pages download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/AdSkip.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/AdSkip.apk
          git commit -m "chore: update APK for Pages download [skip ci]"
          git push
